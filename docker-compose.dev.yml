version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: research_db_dev
    environment:
      POSTGRES_DB: research_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_super_secure_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - research_net_dev

  backend-dev:
    image: node:20-alpine
    container_name: research_backend_dev
    working_dir: /app/backend
    volumes:
      - .:/app
      - /app/backend/node_modules
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=dev_password_super_secure_123
      - DB_NAME=research_platform
      - JWT_SECRET=secret_largo_para_desarrollo_local_mantenlo_seguro
    depends_on:
      - postgres
    networks:
      - research_net_dev
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata_dev:

networks:
  research_net_dev:
    driver: bridge